<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinecall widget</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; }
    /* Two agents on one page: the second button sits on the left, in the same look. */
  </style>
</head>
<body>
  <script type="module" src="./pinecall-widget.js"></script>
  <pinecall-widget agent="bidfire-sales" name="Sam" company="BidFire" tagline="answers about the software"
                   token-url="./server/php/token.php" log-url="./server/php/log.php"></pinecall-widget>
  <pinecall-widget agent="bidfire-dispatch" name="Ava" company="BidFire" tagline="books your technician"
                   phone="+1 (417) 674-3169" position="bottom-left"
                   token-url="./server/php/token.php" log-url="./server/php/log.php"></pinecall-widget>
</body>
</html>
